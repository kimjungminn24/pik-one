name: PicOnlySpot 배포

on:
  push:
    branches:
      - release

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        working-directory: ./backend

      - name: Build Backend
        run: ./gradlew bootJar
        working-directory: ./backend

      - name: Build Frontend
        run: |
          cd frontend
          echo "${{ secrets.FRONTEND_ENV }}" > .env
          npm install 
          npm run build

      - name: Copy frontend build to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "frontend/dist/*"
          target: "/tmp/frontend-build"

      # 비밀값은 서버 /etc/pik-one/backend.env에 있고 systemd가 읽음. 워크플로는 jar만 보냄
      - name: Copy backend JAR to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "backend/build/libs/backend-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/app/pik-one/backend/release"
          strip_components: 3

      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            APP=/home/ubuntu/app/pik-one/backend
            JAR=$APP/backend-0.0.1-SNAPSHOT.jar

            echo "[백엔드 교체]"
            [ -f "$JAR" ] && cp "$JAR" "$JAR.prev"
            mv "$APP/release/backend-0.0.1-SNAPSHOT.jar" "$JAR" || exit 1
            sudo systemctl restart pik-one-backend

            echo "[헬스체크] 60초 안에 UP이 아니면 이전 버전으로 되돌림"
            UP=""
            for i in $(seq 1 30); do
              if curl -fs http://localhost:8080/actuator/health | grep -q UP; then UP=1; break; fi
              sleep 2
            done
            if [ -z "$UP" ]; then
              echo "[실패] 최근 로그"
              sudo journalctl -u pik-one-backend -n 80 --no-pager
              if [ -f "$JAR.prev" ]; then
                mv "$JAR.prev" "$JAR"
                sudo systemctl restart pik-one-backend
                echo "[이전 버전으로 되돌림]"
              fi
              exit 1
            fi
            echo "[백엔드 UP]"

            echo "[프론트엔드 배포]"
            sudo rm -rf /var/www/html/*
            sudo cp -r /tmp/frontend-build/* /var/www/html/
            sudo rm -rf /tmp/frontend-build
